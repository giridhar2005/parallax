[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallax"
version = "1.0.0"
description = "Cross-Modal Forensic Video Compiler with Bi-Temporal Hypergraph & Native macOS Desktop App"
readme = "README.md"
license = "MIT"
authors = [
    { name = "giridhar2005", email = "ggirebathini@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pywebview>=5.0.0",
    "httpx>=0.27.0",
    "pillow>=10.2.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "pyinstaller>=6.4.0",
]

[project.scripts]
parallax = "backend.desktop:main"
parallax-server = "backend.app.main:run_server"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
